[package]
name = "dith"
version = "0.5.0"
edition = "2024"
description = "Agent-friendly CLI tool for crafting beautiful dithered images, vector halftone SVGs, procedural dither art, and visual comparison sheets."

[[bin]]
name = "dith"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The native command-line tool: terminal viewer, self-update, and every subcommand.
cli = ["dep:crossterm", "parallel"]
# Multi-threaded rendering via rayon (outputs are identical with or without it).
parallel = ["dep:rayon"]
# wasm-bindgen API for browsers and Node (build with --no-default-features --features wasm).
wasm = ["dep:wasm-bindgen"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
crossterm = { version = "0.29", optional = true }
flate2 = "1"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
png = "0.18"
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiff = { version = "0.11", default-features = false, features = ["deflate"] }
wasm-bindgen = { version = "0.2", optional = true }
web-time = "1"
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Size-tuned profile for the browser/npm build (see scripts/build-wasm.sh).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
