name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets to (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      # Highest glibc symbol version a Linux binary may import. ubuntu-24.04 ships 2.39.
      GLIBC_MAX: "2.39"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check glibc symbol floor
        if: contains(matrix.target, 'linux-gnu')
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/dith"
          objdump -T "$bin" \
            | awk '{ for (i = 1; i < NF; i++) if ($i ~ /^\(?GLIBC_[0-9.]+\)?$/) { v = $i; gsub(/[()]|GLIBC_/, "", v); print v, $NF } }' \
            | sort -u > glibc-syms.txt
          bad=0
          while read -r ver sym; do
            if [ "$(printf '%s\n%s\n' "$ver" "$GLIBC_MAX" | sort -V | tail -n1)" != "$GLIBC_MAX" ]; then
              echo "::error::$sym needs GLIBC_$ver (ceiling is GLIBC_$GLIBC_MAX)"
              bad=1
            fi
          done < glibc-syms.txt
          rm -f glibc-syms.txt
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "OK: $bin needs nothing newer than GLIBC_$GLIBC_MAX"

      - name: Package tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="dith-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" dith
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: dith-${{ matrix.target }}
          path: |
            dith-${{ matrix.target }}.tar.gz
            dith-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined checksums.txt
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          cat *.sha256 | sort -k2 > checksums.txt
          rm -f *.sha256
          cat checksums.txt

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/dith-*.tar.gz \
            dist/checksums.txt \
            --repo "${{ github.repository }}" \
            --clobber
