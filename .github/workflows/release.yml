name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets to (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="dith-${{ matrix.target }}.tar.gz"
          tar -czf "$asset" -C "target/${{ matrix.target }}/release" dith
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: dith-${{ matrix.target }}
          path: |
            dith-${{ matrix.target }}.tar.gz
            dith-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined checksums.txt
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          cat *.sha256 | sort -k2 > checksums.txt
          rm -f *.sha256
          cat checksums.txt

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/dith-*.tar.gz \
            dist/checksums.txt \
            --repo "${{ github.repository }}" \
            --clobber

  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Skip without NPM_TOKEN
        if: env.NPM_TOKEN == ''
        run: echo "::notice::NPM_TOKEN secret is not set; skipping npm publish."

      - name: Checkout repository
        if: env.NPM_TOKEN != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust toolchain
        if: env.NPM_TOKEN != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen and wasm-opt
        if: env.NPM_TOKEN != ''
        run: scripts/install-wasm-tools.sh

      - name: Install Node
        if: env.NPM_TOKEN != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package version matches the release tag
        if: env.NPM_TOKEN != ''
        working-directory: npm
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"

      - name: Build and test
        if: env.NPM_TOKEN != ''
        run: |
          scripts/build-wasm.sh
          cd npm
          npm ci
          npm run build
          npx vp check
          npx vp test

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
