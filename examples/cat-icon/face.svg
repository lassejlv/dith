<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-1 -1 2 2">
  <title>Ink line work that never changes: outline, nose and mouth (dith --overlay)</title>
  <defs>
    <g id="silhouette">
      <path d="M -0.58 -0.20 L -0.47 -0.68 L -0.20 -0.43 Z" stroke-width="0.12"/>
      <path d="M 0.58 -0.20 L 0.47 -0.68 L 0.20 -0.43 Z" stroke-width="0.12"/>
      <ellipse cx="0" cy="0.10" rx="0.66" ry="0.54" stroke-width="0"/>
    </g>
    <mask id="outside" maskUnits="userSpaceOnUse" x="-1" y="-1" width="2" height="2">
      <rect x="-1" y="-1" width="2" height="2" fill="#fff"/>
      <use href="#silhouette" fill="#000" stroke="#000" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#outside)" fill="#171717" stroke="#171717" stroke-linejoin="round">
    <path d="M -0.58 -0.20 L -0.47 -0.68 L -0.20 -0.43 Z" stroke-width="0.17"/>
    <path d="M 0.58 -0.20 L 0.47 -0.68 L 0.20 -0.43 Z" stroke-width="0.17"/>
    <ellipse cx="0" cy="0.10" rx="0.66" ry="0.54" stroke-width="0.05"/>
  </g>
  <path d="M -0.045 0.150 L 0.045 0.150 L 0 0.195 Z" fill="#171717" stroke="#171717" stroke-width="0.03" stroke-linejoin="round"/>
  <path d="M -0.10 0.235 Q -0.05 0.300 0 0.235 Q 0.05 0.300 0.10 0.235" fill="none" stroke="#171717" stroke-width="0.028" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
